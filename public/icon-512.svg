<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </radialGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(220, 38, 38, 0.4)" stroke-width="4"/>

  <!-- Rising Sun Motif -->
  <circle cx="256" cy="230" r="140" fill="url(#crimsonGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="230" r="140" fill="none" stroke="#fca5a5" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Golden Radiance Ring -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Traditional Torii Gate (鳥居) in Pure Gold & White -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Top Curved Beam (Kasagi & Shimaki) -->
    <path d="M110 160 Q256 135 402 160 L408 178 Q256 155 104 178 Z" />
    <path d="M125 180 Q256 165 387 180 L391 194 Q256 180 121 194 Z" />

    <!-- Secondary Beam (Nuki) -->
    <rect x="135" y="222" width="242" height="18" rx="3" />

    <!-- Pillars (Hashira) -->
    <polygon points="175,190 195,190 185,360 165,360" />
    <polygon points="317,190 337,190 347,360 327,360" />

    <!-- Central Tablet (Gakuzuka) -->
    <rect x="246" y="185" width="20" height="38" rx="2" fill="#fff" />
    
    <!-- Pillar Base Stones (Kamebara) -->
    <rect x="157" y="356" width="36" height="14" rx="4" fill="#64748b" />
    <rect x="319" y="356" width="36" height="14" rx="4" fill="#64748b" />
  </g>

  <!-- Golden Gavel / Crest Accents -->
  <circle cx="256" cy="204" r="5" fill="#dc2626" />

  <!-- Sakura Petals Overlay -->
  <path d="M140 280 C130 270 120 285 130 295 C140 305 155 290 140 280 Z" fill="#f472b6" opacity="0.8"/>
  <path d="M375 270 C365 260 355 275 365 285 C375 295 390 280 375 270 Z" fill="#f472b6" opacity="0.8"/>
  <path d="M210 320 C205 315 198 322 203 328 C208 333 218 325 210 320 Z" fill="#fbcfe8" opacity="0.7"/>
  <path d="M310 325 C305 320 298 327 303 333 C308 338 318 330 310 325 Z" fill="#fbcfe8" opacity="0.7"/>

  <!-- Typography at bottom -->
  <text x="256" y="420" text-anchor="middle" font-family="'Cinzel', 'Noto Serif JP', serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4">JAPAN ARENA</text>
  <text x="256" y="450" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#fca5a5" letter-spacing="3">AUCTION MANAGEMENT</text>
</svg>
